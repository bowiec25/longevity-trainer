[project]
name = "longevity-trainer"
version = "0.1.0"
description = "A quiz that tests longevity knowledge, every answer backed by a trusted source"
readme = "README.md"
authors = [
    { name = "Cameron Bowie", email = "221522165+bowiec25@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.3",
    "pypdf>=7.0.1",
    "rapidfuzz>=3.14.6",
    "streamlit>=1.67.0",
]

[project.scripts]
longevity-trainer = "longevity_trainer:main"
longevity = "longevity_trainer.cli:main"

[tool.uv.build-backend]
# Two packages in one project: generic quizkit (copied from mandarin-hsk-trainer caa969a) + longevity-specific code
module-name = ["quizkit", "longevity_trainer"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
